name: Release

on:
  # picks up upstream metadata changes and, when there are any, releases them in
  # the same run - so consumers get fresh metadata from a plain `npm update`
  schedule:
    - cron: '17 2 * * *'
  # a human pushing to src/** directly still releases - `[skip release]` opts out
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        default: patch
        options: [patch, minor, major, none]

concurrency:
  group: release

jobs:
  # Kept in this file rather than its own: npm's trusted publishing validates the
  # filename of the workflow that *starts* the run, so a `workflow_call` into a
  # separate release.yml makes the OIDC exchange fail with ENEEDAUTH.
  sync:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      # commits the metadata straight onto main - no PR is opened. Deliberately
      # no id-token here, so the sync action can never reach npm directly.
      contents: write
    outputs:
      updated: ${{ steps.metadata.outputs.updated }}
    steps:
      - name: Update metadata
        id: metadata
        uses: Krombik/action-update-phone-metadata@v6
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          constants-file-path: 'constants.ts'
          phone-number-data-type-file-path: 'types/PhoneNumberData.ts'
          iso2-type-file-path: 'types/ISO2.ts'
          phone-number-utils-folder-path: 'phoneNumberUtils'
          create-phone-number-utils-folder-path: 'createPhoneNumberUtils'
          phone-number-formats-folder-path: 'phoneNumberFormats'
          phone-number-validation-patterns-folder-path: 'phoneNumberValidationPatterns'

  release:
    needs: sync
    # `!cancelled()` is what lets this run at all on push and workflow_dispatch,
    # where `sync` is skipped. On the cron path it only releases when the sync
    # actually committed something.
    if: >-
      !cancelled() && needs.sync.result != 'failure' &&
      (github.event_name != 'schedule' || needs.sync.outputs.updated != '0') &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # required for npm trusted publishing (OIDC) and --provenance
      id-token: write
    steps:
      # the sync commits through the API, so github.sha still points at the commit
      # before it - check out the branch tip instead of building stale sources
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      # version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      # touches package.json only, so the paths filter above keeps this from
      # re-triggering the workflow
      - name: Version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BUMP="${{ inputs.bump || 'patch' }}"
          # `none` publishes the version already in package.json - for a release
          # whose number was set by hand, such as a major
          if [ "$BUMP" = none ]; then
            VERSION="v$(node -p "require('./package.json').version")"
            # the tag may already exist when a previous run tagged and pushed but
            # failed later on, in publish - re-running must not die here
            git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null ||
              git tag -a "$VERSION" -m "$VERSION"
          else
            npm version "$BUMP" -m "%s"
          fi
          git push --follow-tags

      - run: pnpm run build

      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm publish ./build --provenance --access public
