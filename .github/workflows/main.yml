name: 'cron-action'

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      # commits the metadata straight onto main - no PR is opened
      contents: write
    outputs:
      updated: ${{ steps.metadata.outputs.updated }}
    steps:
      - name: Update metadata
        id: metadata
        uses: Krombik/action-update-phone-metadata@v6
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          constants-file-path: 'constants.ts'
          phone-number-data-type-file-path: 'types/PhoneNumberData.ts'
          iso2-type-file-path: 'types/ISO2.ts'
          phone-number-utils-folder-path: 'phoneNumberUtils'
          create-phone-number-utils-folder-path: 'createPhoneNumberUtils'
          phone-number-formats-folder-path: 'phoneNumberFormats'
          phone-number-validation-patterns-folder-path: 'phoneNumberValidationPatterns'

  # A commit made with GITHUB_TOKEN does not trigger other workflows, so the push
  # above will never set off release.yml on its own - it has to be called.
  release:
    needs: sync
    if: needs.sync.outputs.updated != '0'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
